name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit, web and integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start the application
        run: |
          java -jar target/hello-world-api.war > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/actuator/health/readiness && exit 0
            sleep 1
          done
          echo "Application did not become ready" && cat app.log && exit 1

      - name: Run Postman collection
        run: npx --yes newman@6 run postman/HelloWorldAPI.postman_collection.json

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hello-world-api:ci .
