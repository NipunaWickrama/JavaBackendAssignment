spring.application.name=hello-world-api

# Let in-flight requests finish when the app is stopped (e.g. during a deployment).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Java 21 virtual threads: handle many concurrent requests without a large thread pool.
spring.threads.virtual.enabled=true

# Expose only the health endpoint: /actuator/health, plus
# /actuator/health/liveness and /actuator/health/readiness for Kubernetes-style probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Logging: every line written while handling a request carries its request ID
# (see RequestLoggingFilter), e.g. "INFO [7f3c9a1e-...] 1234 --- ... RequestLoggingFilter : ...".
# For JSON logs (ELK, Loki, CloudWatch...) set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs;
# the request ID then appears as a "requestId" field.
logging.pattern.level=%5p [%X{requestId:--}]
logging.level.org.example.helloworld=INFO

# OpenAPI documentation: spec at /v3/api-docs, Swagger UI at /swagger-ui.html.
# Only the public API is documented (not actuator or error endpoints).
# To hide the docs in an environment, set both of these to false (e.g. via environment variables
# SPRINGDOC_API_DOCS_ENABLED=false and SPRINGDOC_SWAGGER_UI_ENABLED=false).
springdoc.paths-to-match=/hello-world
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
